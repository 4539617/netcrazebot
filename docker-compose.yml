services:
  netcrazybot:
    build: .
    container_name: netcrazybot
    restart: unless-stopped
    privileged: true
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/amnezia:/opt/amnezia
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
