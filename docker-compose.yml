version: '3.8'

services:
  netcrazybot:
    build: .
    container_name: netcrazybot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

